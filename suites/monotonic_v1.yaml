suite: monotonic_v1
version: 1
description: >
  directions the fitted model supports - the evidence and the deliberate
  exclusions (driver age, vehicle age, area) are docs/monotonicity-notes.md.
checks:
  # z = 75 in the fit; close to definitional for the french no-claims system
  - id: mono_bonus_malus
    family: monotonic
    params:
      aspect: pairs
      factor: bonus_malus
      steps: [50, 70, 90, 120, 160, 200, 230]

  # z = 3.7 on log_density; spans rural to city-center
  - id: mono_density
    family: monotonic
    params:
      aspect: pairs
      factor: density
      steps: [10, 100, 1000, 10000, 30000]

  # rises to the cap...
  - id: mono_veh_power_below_cap
    family: monotonic
    params:
      aspect: pairs
      factor: veh_power
      steps: [4, 6, 8, 10, 12]

  # ...and is flat past it, by construction; this pins the cap at 12
  - id: mono_veh_power_cap
    family: monotonic
    params:
      aspect: flat_past_cap
      factor: veh_power
      values: [12, 13, 14, 15]
